name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that's awkward today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've already tried or considered?
